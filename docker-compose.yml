# Two services: backend API on 5000, frontend (nginx) on 80
services:
  backend:
    build: ./server
    container_name: backend
    restart: always
    # env_file:
    #   - ./server/.env
    environment:
      - PORT=${PORT}
      - MONGO_URI=${MONGO_URI}
    ports:
      - "5000:5000"

  frontend:
    build:
      ./client
      # context: ./client
      # args:
      #   VITE_API_URL: http://3.26.242.54:5000/api
    environment:
      - VITE_API_URL=${VITE_API_URL}
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
